name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Locate fuzz corpus directory
        id: gofuzz
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore and persist the fuzz corpus
        uses: actions/cache@v4
        with:
          # Go accumulates coverage-expanding inputs under $GOCACHE/fuzz. Without
          # this they are lost on every fresh runner, so each night re-explores
          # shallowly from the seed corpus. A unique key forces a save each run,
          # while restore-keys pulls the most recent prior corpus - so tonight
          # resumes from yesterday's coverage and the search deepens over time.
          path: ${{ steps.gofuzz.outputs.dir }}
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Run every fuzz target
        shell: bash
        run: |
          # Discover and run each Fuzz* target for a bounded time. Unlike the seed
          # corpus the unit tests replay, this explores fresh inputs, so a new
          # complexity stall or panic surfaces on its own.
          set -uo pipefail
          fail=0
          for pkg in $(go list ./...); do
            for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              echo "::group::$pkg $fn"
              if ! go test "$pkg" -run '^$' -fuzz="^${fn}$" -fuzztime=60s; then
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit $fail

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
