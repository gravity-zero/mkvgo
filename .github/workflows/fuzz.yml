name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Locate fuzz corpus directory
        id: gofuzz
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore and persist the fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Go accumulates coverage-expanding inputs under $GOCACHE/fuzz. Without
          # this they are lost on every fresh runner, so each night re-explores
          # shallowly from the seed corpus. A unique key forces a save each run,
          # while restore-keys pulls the most recent prior corpus - so tonight
          # resumes from yesterday's coverage and the search deepens over time.
          path: ${{ steps.gofuzz.outputs.dir }}
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Run every fuzz target
        shell: bash
        # The script discovers each Fuzz* target, so a new one is fuzzed the night it lands; make fuzz runs the same.
        run: FUZZTIME=60s scripts/fuzz-all.sh

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  timed-cost:
    # The cost tests count operations so load cannot fail them in CI; a quadratic loop that neither reads nor
    # allocates escapes a count, so their timed twins run here, on the clock, on a runner of their own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Timed cost tests
        # A timed twin the pattern misses is skipped in silence: the job counts the twins that passed.
        run: |
          COSTGUARD_TIMED=1 go test -run 'LinearlyTimed$' -count=1 -v ./... | tee timed.log
          want=$(grep -rhE '^func Test[A-Za-z0-9]*LinearlyTimed\(' --include='*_test.go' . | wc -l)
          got=$(grep -cE '^--- PASS: Test[A-Za-z0-9]*LinearlyTimed ' timed.log)
          [ "$got" -eq "$want" ] || { echo "$got timed twins passed of $want"; exit 1; }
