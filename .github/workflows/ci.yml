name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go.mod pins `toolchain go1.27.0`, so every build uses >= 1.27.0 (an older
        # setup-go version would auto-upgrade to it). Test the pinned floor and the
        # latest stable.
        go-version: ['1.27.0', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Build
        run: go build ./...

      - name: Build (WebAssembly)
        shell: bash
        run: GOOS=js GOARCH=wasm go build ./cmd/mkvgo-wasm/

      - name: Build (32-bit)
        shell: bash
        run: GOOS=linux GOARCH=arm CGO_ENABLED=0 go build ./...

      # 386 binaries run natively on the x86_64 Linux runner: the whole suite
      # executes with a 32-bit int, catching truncation a build alone cannot.
      - name: Test (32-bit)
        if: runner.os == 'Linux'
        run: GOARCH=386 CGO_ENABLED=0 go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=github.com/gravity-zero/mkvgo/ebml,github.com/gravity-zero/mkvgo/mkv/...,github.com/gravity-zero/mkvgo/matroska,github.com/gravity-zero/mkvgo/mp4,github.com/gravity-zero/mkvgo/cmd/mkvgo/commands ./...

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # A prebuilt linter binary type-checks with the Go it was built with and
      # cannot load the standard library of a newer toolchain ("could not import
      # fmt" once stable moved from 1.27.0 to 1.27.2): the linter is built here
      # with the job's own toolchain instead.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability check
        run: govulncheck ./...

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build all platforms
        run: make release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mkvgo-binaries
          path: dist/
