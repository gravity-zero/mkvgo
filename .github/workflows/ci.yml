name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      # Every job runs to the end: one failure must not cancel and hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go.mod's directive is the floor (1.24: package weak); 1.26 is the oldest
        # release Go still supports. Each is tested as is, never auto-upgraded.
        # 1.26.x resolves to the latest patch: the 386 run needs 1.26.5 or newer
        # (golang/go#80004, a heap corruption on 386 in 1.26.0-1.26.4).
        go-version: ['1.24.x', '1.26.x', stable]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Build
        run: go build ./...

      - name: Build (WebAssembly)
        shell: bash
        run: GOOS=js GOARCH=wasm go build ./cmd/mkvgo-wasm/

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: runner.os == 'Linux'
        with:
          node-version: '22.12.0'

      - name: Smoke (WebAssembly, Node)
        if: runner.os == 'Linux'
        run: make wasm-smoke

      - name: Build (32-bit)
        shell: bash
        run: GOOS=linux GOARCH=arm CGO_ENABLED=0 go build ./...

      # 386 binaries run natively on the x86_64 Linux runner: the whole suite
      # executes with a 32-bit int, catching truncation a build alone cannot.
      - name: Test (32-bit)
        if: runner.os == 'Linux'
        run: GOARCH=386 CGO_ENABLED=0 go test ./...

      # Recycled block and pool buffers are filled with 0xDB at each reuse: code
      # still holding one reads garbage and fails instead of passing by chance.
      - name: Test (poisoned buffers)
        if: runner.os == 'Linux'
        run: CGO_ENABLED=0 go test -tags mkvgo_poison ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      # The same check as scripts/gate.sh: a file gofmt would rewrite fails the build.
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v '^bench/' | tee /dev/stderr)"

      # A prebuilt linter binary type-checks with the Go it was built with and
      # cannot load the standard library of a newer toolchain ("could not import
      # fmt" once stable moved from 1.27.0 to 1.27.2): the linter is built here
      # with the job's own toolchain instead.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      # govulncheck judges the standard library of the go on PATH: stable, the one the published binaries are built
      # with. Go 1.24 (go.mod's floor) is out of support and gets no fixes: judged on it, the standard library alone
      # fails the job for good, whatever this module does.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Vulnerability check (stable)
        run: go version && "$(go env GOPATH)/bin/govulncheck" ./...

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Build all platforms
        run: make release

      - name: Upload binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mkvgo-binaries
          path: dist/
