name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      # Every job runs to the end: one failure must not cancel and hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go.mod's directive is the floor (1.24: package weak); 1.26 is the oldest
        # release Go still supports. Each is tested as is, never auto-upgraded.
        # 1.26.x resolves to the latest patch: the 386 run needs 1.26.5 or newer
        # (golang/go#80004, a heap corruption on 386 in 1.26.0-1.26.4).
        go-version: ['1.24.x', '1.26.x', stable]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Build
        run: go build ./...

      - name: Build (WebAssembly)
        shell: bash
        run: GOOS=js GOARCH=wasm go build ./cmd/mkvgo-wasm/

      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'
        with:
          node-version: '22.12.0'

      - name: Smoke (WebAssembly, Node)
        if: runner.os == 'Linux'
        run: make wasm-smoke

      - name: Build (32-bit)
        shell: bash
        run: GOOS=linux GOARCH=arm CGO_ENABLED=0 go build ./...

      # 386 binaries run natively on the x86_64 Linux runner: the whole suite
      # executes with a 32-bit int, catching truncation a build alone cannot.
      - name: Test (32-bit)
        if: runner.os == 'Linux'
        run: GOARCH=386 CGO_ENABLED=0 go test ./...

      # Recycled block and pool buffers are filled with 0xDB at each reuse: code
      # still holding one reads garbage and fails instead of passing by chance.
      - name: Test (poisoned buffers)
        if: runner.os == 'Linux'
        run: CGO_ENABLED=0 go test -tags mkvgo_poison ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=github.com/gravity-zero/mkvgo/ebml,github.com/gravity-zero/mkvgo/mkv/...,github.com/gravity-zero/mkvgo/matroska,github.com/gravity-zero/mkvgo/mp4,github.com/gravity-zero/mkvgo/cmd/mkvgo/commands ./...

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # The same check as scripts/gate.sh: a file gofmt would rewrite fails the build.
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v '^bench/' | tee /dev/stderr)"

      # A prebuilt linter binary type-checks with the Go it was built with and
      # cannot load the standard library of a newer toolchain ("could not import
      # fmt" once stable moved from 1.27.0 to 1.27.2): the linter is built here
      # with the job's own toolchain instead.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability check
        run: govulncheck ./...

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Build all platforms
        run: make release

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: mkvgo-binaries
          path: dist/
